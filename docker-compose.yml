services:
  backend:
    build:
      context: ./backend
    container_name: troca-figurinhas-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    networks:
      - troca-figurinhas-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:3001
    container_name: troca-figurinhas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - troca-figurinhas-network

networks:
  troca-figurinhas-network:
    driver: bridge
